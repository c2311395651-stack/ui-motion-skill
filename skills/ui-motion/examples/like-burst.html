<!doctype html>
<!-- 按提示词 s1 生成的实测网页：点赞爆粒子 -->
<html><head><meta charset="utf-8"><title>Like Burst</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#111317;font-family:system-ui,sans-serif;color:#fff}
.like{position:relative;display:flex;align-items:center;gap:14px;height:72px;padding:0 28px 0 20px;border-radius:36px;border:0;background:#1e2026;color:#fff;font-size:26px;cursor:pointer}
.heart{position:relative;width:40px;height:40px}
.heart svg{width:40px;height:40px;display:block}
.heart path{fill:#6b6f7a;transition:fill .2s}
.like.on .heart path{fill:#FF4D6A}
.dot{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;opacity:0;pointer-events:none}
.count{height:32px;overflow:hidden;line-height:32px}
.count .col{display:flex;flex-direction:column}
</style></head><body>
<button class="like" id="like" aria-pressed="false" aria-label="点赞">
 <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></span>
 <span class="count"><span class="col"><span>1,286</span><span>1,287</span></span></span>
</button>
<script>
const btn=document.getElementById('like'),heart=btn.querySelector('.heart'),col=btn.querySelector('.col');
const COLORS=['#FF4D6A','#FFC83D','#4FD1E8','#9D8CFF','#3DD68C','#FF9F43','#FF6B5B','#5B8CFF'];
// 8 个彩色小圆点
const dots=COLORS.map(c=>{const d=document.createElement('span');d.className='dot';d.style.background=c;heart.appendChild(d);return d;});
btn.addEventListener('click',()=>{
  const on=!btn.classList.contains('on');btn.classList.toggle('on',on);btn.setAttribute('aria-pressed',on);
  if(!on){col.animate([{transform:'translateY(-32px)'},{transform:'translateY(0)'}],{duration:300,fill:'forwards',easing:'ease-out'});return;}
  // 爱心：缩到 0.8 → 弹到 1.2 → 回到 1，回弹曲线
  heart.querySelector('svg').animate([{transform:'scale(1)'},{transform:'scale(.8)',offset:.25},{transform:'scale(1.2)',offset:.6},{transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.34,1.56,.64,1)'});
  // 小圆点向外飞散并淡出
  dots.forEach((d,i)=>{const a=i/8*Math.PI*2,r=46;
    d.animate([{transform:'translate(0,0) scale(.4)',opacity:0},{opacity:1,offset:.2},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1)`,opacity:0}],{duration:600,delay:120,easing:'cubic-bezier(.2,.7,.3,1)'});});
  // 数字向上滚动 +1
  col.animate([{transform:'translateY(0)'},{transform:'translateY(-32px)'}],{duration:400,delay:150,fill:'forwards',easing:'cubic-bezier(.34,1.56,.64,1)'});
});
</script></body></html>
