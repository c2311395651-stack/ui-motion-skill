<!doctype html>
<!-- 按提示词 s4 生成的实测网页：长按确认删除 -->
<html><head><meta charset="utf-8"><title>Hold to Confirm</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#111317;font-family:system-ui,sans-serif;color:#fff}
.hold{position:relative;width:120px;height:120px;border:0;border-radius:50%;background:#2a1d1d;cursor:pointer}
.hold>svg{position:absolute;inset:0}
.ring{fill:none;stroke:#FF6B5B;stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px}
.track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:6}
.icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
.hold.done{background:#1d2a22}
.hold.done .ring{stroke:#3DD68C}
.tip{font-size:20px;color:rgba(255,255,255,.6)}
</style></head><body>
<button class="hold" id="hd" aria-label="长按删除">
 <svg width="120" height="120"><circle class="track" cx="60" cy="60" r="54"/><circle class="ring" cx="60" cy="60" r="54"/></svg>
 <span class="icon" id="ic"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FF6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></span></button>
<div class="tip" id="tip">按住删除</div>
<script>
const b=document.getElementById('hd'),ring=b.querySelector('.ring'),ic=document.getElementById('ic'),tip=document.getElementById('tip');
const C=2*Math.PI*54,HOLD=1500;ring.style.strokeDasharray=C;
let p=0,holding=false,last=0,done=false;
const draw=()=>{ring.style.strokeDashoffset=C*(1-p);ring.style.opacity=p>0?1:0;};draw();   // 进度为 0 时隐藏，避免圆头残留一个点
function tick(now){const dt=now-last;last=now;
  if(holding)p=Math.min(1,p+dt/HOLD);else p=Math.max(0,p-dt/400);   // 松手 400ms 内倒退归零
  draw();
  if(p>=1&&!done){done=true;holding=false;
    b.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:300});
    b.classList.add('done');tip.textContent='已删除';
    ic.innerHTML='<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';return;}
  if(holding||p>0)requestAnimationFrame(tick);}
const start=()=>{if(done)return;holding=true;last=performance.now();requestAnimationFrame(tick);};
const stop=()=>{holding=false;};
b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(e=>b.addEventListener(e,stop));
</script></body></html>
